<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#101612" />
		<title>Offline | Final Word</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #101612;
				color: #fff;
				font-family: system-ui, sans-serif;
				text-align: center;
				padding: 1.5rem;
			}
			img { width: 96px; height: 96px; border-radius: 20px; }
			button {
				margin-top: 1rem;
				padding: 0.75rem 1.5rem;
				border: 0;
				border-radius: 0.5rem;
				background: #16f14c;
				color: #101612;
				font-weight: 700;
				font-size: 1rem;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<main>
			<img src="/icons/icon-192.png" alt="Final Word logo" />
			<h1>You're offline</h1>
			<p>Final Word needs a connection to play. Check your network and try again.</p>
			<button type="button" onclick="location.reload()">Retry</button>
		</main>
	</body>
</html>
